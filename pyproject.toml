[project]
name = "redis-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Dener Pires",email = "alltheearth.tech@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "django (>=5.2,<6.0)",
    "djangorestframework (>=3.16,<4.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "dj-database-url (>=3.1.2,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-filter (>=26.1,<27.0)",
    "google-api-python-client (>=2.100,<3.0)",
    "google-auth (>=2.30,<3.0)",
    "channels (>=4.1,<5.0)",
    "channels-redis (>=4.2,<5.0)",
    "daphne (>=4.1,<5.0)",
    "redis (>=5.0,<6.0)",
    "celery (>=5.4,<6.0)",
    "whitenoise (>=6.7,<7.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "reportlab (>=4.2,<5.0)",
    "pywebpush (>=2.5.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
