# Deploy: docker stack deploy -c swarm-stack.yml redis-api
# Variáveis (${VAR}) são resolvidas pelo Docker CLI a partir de um .env no
# diretório atual ou do ambiente do shell — `docker stack deploy` NÃO suporta
# a chave `env_file:` (só docker compose suporta), por isso os segredos vêm
# via `environment:` com interpolação.
#
# Configurado para um deploy de TESTE em rede local, acessado direto por
# IP:porta (sem domínio, sem proxy reverso, sem TLS) — o container escuta na
# 8000, mas é publicado na 8090 do host (8000/8001 já estão ocupadas nesse
# servidor) via routing mesh do Swarm, então
# http://<qualquer-node-do-swarm>:8090/ funciona a partir de qualquer
# dispositivo na mesma rede. Pra isso funcionar, o .env usado no deploy
# precisa ter (veja .env.example):
#   ALLOWED_HOSTS=*
#   CORS_ALLOW_ALL_ORIGINS=True
#   SECURE_SSL_REDIRECT=False
#   SESSION_COOKIE_SECURE=False
#   CSRF_COOKIE_SECURE=False
# Se um dia isso for exposto na internet de verdade, troque por domínio real
# + Traefik/nginx com TLS e reative ALLOWED_HOSTS/CORS_ALLOWED_ORIGINS
# restritos (exemplo de labels Traefik comentado no serviço `app` abaixo).

x-image: &image ${IMAGE:-redis-api}:${TAG:-latest}

x-env: &env
  SECRET_KEY: ${SECRET_KEY}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  DATABASE_URL: ${DATABASE_URL}
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
  CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
  GOOGLE_SHEETS_CREDENTIALS_JSON: ${GOOGLE_SHEETS_CREDENTIALS_JSON:-}
  GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
  GOOGLE_SHEETS_RANGE: ${GOOGLE_SHEETS_RANGE:-}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  DJANGO_SETTINGS_MODULE: config.settings.production

services:
  app:
    image: *image
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    environment: *env
    ports:
      - target: 8000
        published: 8090
        mode: ingress
    networks:
      - redis-api-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      # Sem proxy reverso neste deploy de teste — acesso direto por IP:8090.
      # Se depois isso for atrás de um Traefik com domínio/TLS de verdade,
      # troque o "ports:" acima por algo assim:
      # labels:
      #   - "traefik.enable=true"
      #   - "traefik.http.routers.redis-api.rule=Host(`api.seu-dominio.com`)"
      #   - "traefik.http.routers.redis-api.entrypoints=websecure"
      #   - "traefik.http.routers.redis-api.tls.certresolver=letsencrypt"
      #   - "traefik.http.services.redis-api.loadbalancer.server.port=8000"

  worker:
    image: *image
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment: *env
    networks:
      - redis-api-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  beat:
    image: *image
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment: *env
    networks:
      - redis-api-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    volumes:
      - redis_api_redis_data:/data
    networks:
      - redis-api-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  redis-api-net:
    driver: overlay
    # Sem "internal: true" — a API precisa alcançar o Supabase externamente
    # (mesma lição documentada no deploy do nicodemus-adm: "internal: true" na
    # rede overlay bloqueia acesso à internet).

volumes:
  redis_api_redis_data:
